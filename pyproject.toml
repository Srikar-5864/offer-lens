[project]
name = "offerlens"
version = "0.1.0"
description = "Messy Indian deal text in, schema-valid JSON out, on a fine-tuned 1.5B model served by SGLang."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# Pipeline kits (heavy; not needed to run the API/tests).
pipeline = [
    "curatorkit==0.1.22",
    "aligntune==0.1.17",
    "auditkit[openai]==1.1.3",
    "torchao<0.14",
    "datasets>=3.0",
    "peft>=0.13",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerlens"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["offerlens"]

[[tool.mypy.overrides]]
module = ["curatorkit.*", "aligntune.*", "auditkit.*", "datasets.*", "peft.*", "transformers.*", "torch.*", "slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a running SGLang server (skipped in CI)"]
addopts = "-m 'not gpu'"
